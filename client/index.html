<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Paranoia</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div id="nameModal" class="modal-overlay">
    <div class="modal-box">
      <label for="nameInput">Display name</label>
      <div class="name-row">
        <input type="text" id="nameInput" maxlength="20" placeholder="e.g. Alex" autocomplete="off" />
        <button id="nameSubmit">OK</button>
      </div>
    </div>
  </div>

  <!-- Home -->
  <div id="viewHome" class="view">
    <h1 class="logo">Agent Paranoia</h1>
    <div id="nameDisplay" class="name-display"></div>
    <button id="createBtn" class="btn-primary">Create Room</button>
    <div class="or-divider">or</div>
    <div class="join-row">
      <input id="roomInput" type="text" class="code-input" placeholder="ABC-DEF"
             maxlength="7" autocomplete="off" spellcheck="false" />
      <button id="joinBtn">Join</button>
    </div>
  </div>

  <!-- Lobby -->
  <div id="viewLobby" class="view" hidden>
    <h1 class="logo">Agent Paranoia</h1>
    <p class="muted">Share this code with your peer:</p>
    <div id="roomCode" class="room-code"></div>
    <button id="copyBtn">Copy</button>
    <div class="lobby-waiting">
      <div class="spinner"></div>
      <span class="muted">Waiting for peer…</span>
    </div>
    <button id="cancelLobbyBtn" class="cancel-btn">← Back</button>
  </div>

  <!-- Session -->
  <div id="viewSession" class="view" hidden>
    <div class="topbar">
      <strong>Agent Paranoia</strong>
      <span id="peerStatus" class="status-dot waiting">● Waiting for peer</span>
    </div>

    <div class="chat-panel">
      <div class="panel-header">
        <span>Chat</span>
        <span class="export-group">
          <button id="exportTxtBtn">txt</button>
          <button id="exportJsonBtn">json</button>
          <button id="exportHtmlBtn">html</button>
        </span>
      </div>
      <div id="messages" class="messages" role="log" aria-live="polite"></div>
      <div class="chat-foot">
        <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off" disabled />
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>

    <div id="dropzone" class="dropzone">
      <span id="dropText">Drop a file here or </span><label for="fileInput" id="browseLabel">browse</label>
      <input type="file" id="fileInput" hidden />
    </div>
    <div id="sendQueue"></div>
    <div id="receiveArea"></div>
  </div>

  <!-- Settings -->
  <div id="settingsModal" class="modal-overlay" hidden>
    <div class="modal-box settings-box" role="dialog" aria-labelledby="settingsTitle">
      <label id="settingsTitle">Settings</label>
      <div class="setting-row">
        <div class="setting-name" id="folderLabel">Download folder</div>
        <div id="folderValue" class="setting-value"></div>
        <div id="folderActions" class="setting-actions">
          <button id="chooseFolderBtn">Choose folder…</button>
          <button id="clearFolderBtn">Clear</button>
        </div>
      </div>
      <div class="modal-foot">
        <button id="closeSettingsBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- Incoming file offer -->
  <div id="offerModal" class="modal-overlay" hidden>
    <div class="modal-box offer-box" role="dialog" aria-labelledby="offerTitle">
      <label id="offerTitle">Incoming file</label>
      <p id="offerFrom" class="offer-from"></p>
      <p id="offerFile" class="offer-file"></p>
      <p id="offerDest" class="muted"></p>
      <p id="offerWarn" class="offer-warn" hidden></p>
      <div class="modal-foot">
        <button id="declineBtn">Decline</button>
        <button id="acceptBtn" class="btn-accept">Accept</button>
      </div>
    </div>
  </div>

  <div class="corner-buttons">
    <button id="settingsBtn" class="theme-toggle">Settings</button>
    <button id="themeToggle" class="theme-toggle">日本語</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
